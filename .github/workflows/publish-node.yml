# Reusable publish of a pnpm package to GitHub Packages from a release tag, after
# the same install/typecheck/test/build gates as CI. Prerelease tags (vX.Y.Z-rc.N)
# publish under the dist-tag "next", others under "latest".
#
# Kept apart from release-please.yml so only repos that publish grant
# `packages: write`: a called workflow can't ask for more than its caller grants,
# even in a job that would be skipped.
#
# Caller example (second job after release-please.yml):
#
#   publish:
#     needs: release-please
#     if: needs.release-please.outputs.release_created == 'true'
#     permissions:
#       contents: read
#       packages: write
#     uses: polinom-io/px-workflows-public/.github/workflows/publish-node.yml@<sha> # vX.Y.Z
#     with:
#       tag: ${{ needs.release-please.outputs.tag_name }}
#       build-script: ""
name: publish-node

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z); must match package.json version
        type: string
        required: true
      working-directory:
        description: Directory of the package to publish, relative to the repo root
        type: string
        default: .
      typecheck-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: typecheck
      test-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: test
      build-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: build

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # publish to GitHub Packages
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, so nothing reaches the registry that main would reject.
      - name: Typecheck
        if: inputs.typecheck-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
      - name: Test
        if: inputs.test-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.test-script }}
      - name: Build
        if: inputs.build-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.build-script }}

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 12 reads credentials only from the user config, never from the repo's .npmrc.
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          pnpm publish --no-git-checks --registry https://npm.pkg.github.com --tag "$dist_tag"
