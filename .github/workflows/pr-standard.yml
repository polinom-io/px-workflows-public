# Reusable check that a pull request follows the org PR structure
# (template: polinom-io/.github, .github/pull_request_template.md).
#
# Every PR, bots included:
#   - title is a Conventional Commit: lowercase type, optional (scope), optional !,
#     a description that doesn't start uppercase or end with a period, and at
#     most 72 characters (it becomes the squash commit).
# Human and agent PRs also need, each with real text (HTML comments don't count):
#   - "## Summary"
#   - "## Test plan" (an unverified change says so; it is never empty)
#   - "## Checklist" with the template's five items, ticked or not (ticking is
#     the author's statement). Items are matched by keyword: signed, secret,
#     personal data, reusable workflow, docs.
# "## After merge", "## Notes", "## Not in this PR" and Refs/Closes are optional.
#
# Body checks are skipped only when the author is a bot (user type Bot, which
# only GitHub Apps have). The head branch never skips anything on its own.
#
# Title and body reach the script only through env vars.
#
# Caller example (pin by full commit SHA). Include `edited` so fixing the title or
# body re-runs it; the check is named `<caller job> / check`:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   permissions:
#     contents: read
#   jobs:
#     pr-standard:
#       permissions:
#         contents: read
#       uses: polinom-io/px-workflows-public/.github/workflows/pr-standard.yml@<sha> # vX.Y.Z
name: pr-standard

on:
  workflow_call:
    inputs:
      test-mode:
        description: For this repo's tests only. Check the test-* inputs instead of the event and report without failing
        type: boolean
        default: false
      test-title:
        type: string
        default: ""
      test-body:
        type: string
        default: ""
      test-author-type:
        type: string
        default: User
    outputs:
      result:
        description: "pass, fail, or title-only (bot author: title checked, body skipped)"
        value: ${{ jobs.check.outputs.result }}
      problems:
        description: Problems found, separated by "; "
        value: ${{ jobs.check.outputs.problems }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.check.outputs.result }}
      problems: ${{ steps.check.outputs.problems }}
    steps:
      - name: Check title and body against the PR structure
        id: check
        env:
          TEST_MODE: ${{ inputs.test-mode }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          EVENT_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          TEST_TITLE: ${{ inputs.test-title }}
          TEST_BODY: ${{ inputs.test-body }}
          TEST_AUTHOR_TYPE: ${{ inputs.test-author-type }}
        shell: python3 {0}
        run: |
          import os, re, sys

          env = os.environ
          test = env["TEST_MODE"] == "true"
          if not test and not env["EVENT_NAME"].startswith("pull_request"):
              print("::error::Not a pull_request event; call this workflow from on: pull_request.")
              sys.exit(1)
          src = "TEST_" if test else "EVENT_"
          title = env.get(src + "TITLE", "")
          body = (env.get(src + "BODY", "") or "").replace("\r\n", "\n")
          is_bot = env.get(src + "AUTHOR_TYPE", "") == "Bot"

          problems = []

          # Org Conventional Commit title rule: lowercase type, optional scope and !,
          # description not starting uppercase or ending with a period, <= 72 characters.
          types = "feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert"
          if not re.fullmatch(rf"(?:{types})(?:\([a-z0-9._-]+\))?!?: [^A-Z].*[^.]", title):
              problems.append(f"Title is not a Conventional Commit with a lowercase description and no final period (<type>(<scope>)?: <description>; types: {types.replace('|', ' ')})")
          if len(title) > 72:
              problems.append(f"Title is {len(title)} characters; limit is 72")

          if not is_bot:
              text = re.sub(r"<!--.*?-->", "", body, flags=re.S)
              sections = {}
              current = None
              for line in text.split("\n"):
                  m = re.match(r"^##\s+(.+?)\s*$", line)
                  if m:
                      current = m.group(1).strip().lower()
                      sections.setdefault(current, [])
                  elif current is not None:
                      sections[current].append(line)

              for name in ("Summary", "Test plan", "Checklist"):
                  key = name.lower()
                  if key not in sections:
                      problems.append(f'Missing section "## {name}"')
                  elif not "\n".join(sections[key]).strip():
                      problems.append(f'Section "## {name}" is empty')

              if sections.get("checklist"):
                  items = [l.lower() for l in sections["checklist"] if re.match(r"^\s*[-*]\s+\[[ xX]\]\s+", l)]
                  keywords = {
                      "signed": "Commits are signed",
                      "secret": "No secrets, keys or tokens",
                      "personal data": "No real personal data",
                      "reusable workflow": "Shared reusable workflow considered",
                      "docs": "Docs updated",
                  }
                  for key, label in keywords.items():
                      if not any(key in l for l in items):
                          problems.append(f'Checklist item missing: "{label}"')

          result = "fail" if problems else ("title-only" if is_bot else "pass")
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"result={result}\n")
              out.write("problems=" + "; ".join(problems) + "\n")
          with open(env["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### PR standard: {result}\n")
              if is_bot:
                  summary.write("Bot author: title checked, body skipped.\n")
              for p in problems:
                  summary.write(f"- {p}\n")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems and not test else 0)
