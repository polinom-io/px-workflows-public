# Reusable release-please: opens/updates a release PR from Conventional Commits on
# the default branch; merging it tags vX.Y.Z and writes CHANGELOG.md.
#
# It authenticates with a GitHub App token (not GITHUB_TOKEN) so checks run on the
# release PR and the tag can trigger other workflows. The App needs contents,
# pull-requests and issues write on the caller repo.
#
# Optional publish job: with `publish: true`, a created release is published to
# GitHub Packages from the tag, after the same install/typecheck/test/build gates
# as CI. The caller must grant `packages: write`.
#
# Caller example (pin this workflow by full commit SHA; pass secrets explicitly,
# never `secrets: inherit`):
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     release:
#       permissions:
#         contents: read
#         packages: write   # only when publish: true
#       uses: polinom-io/px-workflows-public/.github/workflows/release-please.yml@<sha> # vX.Y.Z
#       with:
#         app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#         publish: true
#         build-script: ""
#       secrets:
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
name: release-please

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID (or App ID) of the GitHub App that release-please acts as
        type: string
        required: true
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      publish:
        description: Publish the package to GitHub Packages when a release is created
        type: boolean
        default: false
      working-directory:
        description: Directory of the package to publish, relative to the repo root
        type: string
        default: .
      typecheck-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: typecheck
      test-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: test
      build-script:
        description: Script run before publishing ("" to skip)
        type: string
        default: build
    secrets:
      app-private-key:
        description: Private key of the GitHub App
        required: true
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  publish:
    needs: release-please
    if: inputs.publish && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # publish to GitHub Packages
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, so nothing reaches the registry that main would reject.
      - name: Typecheck
        if: inputs.typecheck-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
      - name: Test
        if: inputs.test-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.test-script }}
      - name: Build
        if: inputs.build-script != ''
        run: pnpm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.build-script }}

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 12 reads credentials only from the user config, never from the repo's .npmrc.
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          pnpm publish --no-git-checks --registry https://npm.pkg.github.com --tag "$dist_tag"
