# Reusable release-please: opens/updates a release PR from Conventional Commits on
# the default branch; merging it tags vX.Y.Z and writes CHANGELOG.md.
#
# It authenticates with a GitHub App token (not GITHUB_TOKEN) so checks run on the
# release PR and the tag can trigger other workflows. The App needs contents,
# pull-requests and issues write on the caller repo. GITHUB_TOKEN stays read-only.
#
# To publish a package, call publish-node.yml from a second job gated on the
# `release_created` output (see that file's header).
#
# Runs are serialized per ref (concurrency group `release-please-<ref>`, never
# cancelled). Callers must not define their own concurrency group with that same
# name: the called job would wait on its own caller run.
#
# Caller example (pin this workflow by full commit SHA; pass secrets explicitly,
# never `secrets: inherit`):
#
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     release-please:
#       permissions:
#         contents: read
#       uses: polinom-io/px-workflows-public/.github/workflows/release-please.yml@<sha> # vX.Y.Z
#       with:
#         app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#       secrets:
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
name: release-please

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID (or App ID) of the GitHub App that release-please acts as
        type: string
        required: true
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      app-private-key:
        description: Private key of the GitHub App
        required: true
    outputs:
      release_created:
        description: "'true' when this run created a release"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of the created release (vX.Y.Z)
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
