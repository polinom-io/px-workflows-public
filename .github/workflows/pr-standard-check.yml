# Checks this repo's own PRs with pr-standard.yml (check `pr-standard / check`) and tests it
# against fixture titles and bodies in test-mode, which reports without failing;
# the assert job checks each outcome so the run stays green.
name: pr-standard-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-standard:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml

  t-valid:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "feat(api)!: add invoice export"
      test-body: |
        ## Summary

        Adds invoice export.

        ## Test plan

        Ran the unit tests.

        ## Checklist

        - [x] Commits are signed.
        - [ ] No secrets, keys or tokens (point to where they live instead).
        - [x] No real personal data in code, fixtures, logs or screenshots: synthetic data only.
        - [ ] New or changed workflows: a shared reusable workflow was considered first.
        - [x] Docs updated if behaviour or setup changed.

        ## After merge

        Nothing.

        Refs #1

  t-unfilled-template:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "fix: handle empty input"
      test-body: |
        ## Summary

        <!-- What changes and why. -->

        ## Test plan

        <!-- Commands run. -->

        ## Checklist

        <!-- Items go here. -->

  t-old-headings:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "fix: handle empty input"
      test-body: |
        ## Summary
        Handles empty input.

        ## How it was tested
        Unit tests.

        ## Checklist
        - [x] Commits are signed.
        - [x] No secrets.
        - [x] No real personal data.
        - [x] Reusable workflow considered.
        - [x] Docs updated.

  t-bad-titles:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "Feat: Add a deliberately long description that goes well past the limit."
      test-author-type: Bot

  t-human-on-bot-branch:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "docs(context): sync shared ai context v1.2.3"
      test-body: ""

  t-bot:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-standard.yml
    with:
      test-mode: true
      test-title: "chore(main): release 1.2.3"
      test-author-type: Bot
      test-body: ":robot: I have created a release"

  assert:
    needs: [t-valid, t-unfilled-template, t-old-headings, t-bad-titles, t-human-on-bot-branch, t-bot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert outcomes
        env:
          JOBS: >-
            ${{ needs.t-valid.result }} ${{ needs.t-unfilled-template.result }}
            ${{ needs.t-old-headings.result }} ${{ needs.t-bad-titles.result }}
            ${{ needs.t-human-on-bot-branch.result }} ${{ needs.t-bot.result }}
          VALID: ${{ needs.t-valid.outputs.result }}
          VALID_PROBLEMS: ${{ needs.t-valid.outputs.problems }}
          UNFILLED: ${{ needs.t-unfilled-template.outputs.result }}
          UNFILLED_PROBLEMS: ${{ needs.t-unfilled-template.outputs.problems }}
          OLD: ${{ needs.t-old-headings.outputs.result }}
          OLD_PROBLEMS: ${{ needs.t-old-headings.outputs.problems }}
          TITLES: ${{ needs.t-bad-titles.outputs.result }}
          TITLES_PROBLEMS: ${{ needs.t-bad-titles.outputs.problems }}
          HUMAN: ${{ needs.t-human-on-bot-branch.outputs.result }}
          HUMAN_PROBLEMS: ${{ needs.t-human-on-bot-branch.outputs.problems }}
          BOT: ${{ needs.t-bot.outputs.result }}
          BOT_PROBLEMS: ${{ needs.t-bot.outputs.problems }}
        run: |
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "::error::$1: expected '$3', got '$2'"; fail=1; fi; }
          has() { case "$2" in *"$3"*) echo "ok   $1";; *) echo "::error::$1: '$3' not in '$2'"; fail=1;; esac; }
          check "all test jobs succeed" "$JOBS" "success success success success success success"
          check "valid body passes (problems: $VALID_PROBLEMS)" "$VALID" "pass"
          check "unfilled template fails" "$UNFILLED" "fail"
          has "unfilled: empty Summary" "$UNFILLED_PROBLEMS" 'Section "## Summary" is empty'
          has "unfilled: empty Test plan" "$UNFILLED_PROBLEMS" 'Section "## Test plan" is empty'
          has "unfilled: empty Checklist" "$UNFILLED_PROBLEMS" 'Section "## Checklist" is empty'
          check "old 'How it was tested' heading fails" "$OLD" "fail"
          has "old headings: no Test plan" "$OLD_PROBLEMS" 'Missing section "## Test plan"'
          check "bad bot titles fail" "$TITLES" "fail"
          has "titles: uppercase/period rejected" "$TITLES_PROBLEMS" "Title is not a Conventional Commit"
          has "titles: over 72 rejected" "$TITLES_PROBLEMS" "limit is 72"
          check "human with empty body fails" "$HUMAN" "fail"
          has "human: body checked" "$HUMAN_PROBLEMS" 'Missing section "## Summary"'
          check "bot: title checked, body skipped (problems: $BOT_PROBLEMS)" "$BOT" "title-only"
          exit "$fail"
